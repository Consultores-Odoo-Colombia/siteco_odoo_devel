services:
  db:
    image: 'postgres:16'
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: '--lc-collate=C'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - 'db-data:/var/lib/postgresql/data'
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: 'redis:7-alpine'
    restart: always
    command:
      - redis-server
      - '--appendonly'
      - 'yes'
      - '--maxmemory'
      - '512mb'
      - '--maxmemory-policy'
      - allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - 'redis-data:/data'
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  odoo:
    image: '${ODOO_IMAGE}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: '${SERVICE_NAME}'
      DOMAIN: '${DOMAIN}'
      ODOO_IMAGE: '${ODOO_IMAGE}'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${POSTGRES_PASSWORD}'
      DBNAME: '${DBNAME}'
      DBFILTER: '^.*db$'
      ODOO_SESSION_REDIS: '1'
      ODOO_SESSION_REDIS_HOST: redis
      ODOO_SESSION_REDIS_PORT: '6379'
      ODOO_SESSION_REDIS_PREFIX: '${SERVICE_NAME}'
      HTTP_INTERFACE: 0.0.0.0
      HTTP_PORT: '8069'
      PROXY_MODE: 'True'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD}'
      WORKERS: '4'
      MAX_CRON_THREADS: '2'
      LIMIT_MEMORY_SOFT: '2147483648'
      LIMIT_MEMORY_HARD: '2684354560'
      LIMIT_TIME_CPU: '60'
      LIMIT_TIME_REAL: '120'
      LOG_LEVEL: info
      LOG_HANDLER: ':INFO'
      WITHOUT_DEMO: all
      LIST_DB: 'True'
    volumes:
      - 'odoo-data:/var/lib/odoo/data'
      - 'odoo-logs:/var/lib/odoo/logs'
      - 'odoo-modules:/mnt/extra-addons'
    expose:
      - '8069'
      - '8072'
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.https-${SERVICE_NAME}.entryPoints=https'
      - 'traefik.http.routers.https-${SERVICE_NAME}.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.https-${SERVICE_NAME}.tls=true'
      - 'traefik.http.routers.https-${SERVICE_NAME}.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.https-${SERVICE_NAME}.service=svc-${SERVICE_NAME}'
      - 'traefik.http.routers.ws-${SERVICE_NAME}.entryPoints=https'
      - 'traefik.http.routers.ws-${SERVICE_NAME}.rule=Host(`${DOMAIN}`) && PathPrefix(`/websocket`)'
      - 'traefik.http.routers.ws-${SERVICE_NAME}.tls=true'
      - 'traefik.http.routers.ws-${SERVICE_NAME}.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.ws-${SERVICE_NAME}.service=svc-ws-${SERVICE_NAME}'
      - 'traefik.http.services.svc-${SERVICE_NAME}.loadbalancer.server.port=8069'
      - 'traefik.http.services.svc-ws-${SERVICE_NAME}.loadbalancer.server.port=8072'
    healthcheck:
      test:
        - CMD
        - curl
        - '-sf'
        - 'http://127.0.0.1:8069/web/health'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - backend
      - traefik-public
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
volumes:
  db-data: null
  redis-data: null
  odoo-data: null
  odoo-logs: null
  odoo-modules: null
networks:
  backend:
    driver: bridge
  traefik-public:
    external: true
    name: coolify
