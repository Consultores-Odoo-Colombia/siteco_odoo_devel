[options]
# =============================================================================
# Database Configuration
# =============================================================================
db_host = ${DB_HOST:-db}
db_port = ${DB_PORT:-5432}
db_user = ${DB_USER:-odoo}
db_password = ${DB_PASSWORD:-odoo}
db_name = ${DB_NAME:-odoo}
db_maxconn = ${DB_MAXCONN:-64}
db_sslmode = ${DB_SSLMODE:-prefer}
db_template = ${DB_TEMPLATE:-template1}

# =============================================================================
# Addons Configuration
# /mnt/extra-addons es el volumen persistente para custom addons.
# Puedes subir addons a posteriori via SFTP/S3/git; Odoo los detecta al reiniciar.
# =============================================================================
addons_path = /opt/odoo/addons,/mnt/extra-addons
# Volumen persistente montado en /var/lib/odoo. Aquí van filestore, sessions,
# config y el venv mutable.
data_dir = /var/lib/odoo

# =============================================================================
# Server Configuration
# =============================================================================
http_interface = ${HTTP_INTERFACE:-0.0.0.0}
http_port = ${HTTP_PORT:-8069}
proxy_mode = ${PROXY_MODE:-True}
workers = ${WORKERS:-4}
server_wide_modules = ${SERVER_WIDE_MODULES:-base,web}

# =============================================================================
# Admin Password (master password for database management)
# Se regenera desde ADMIN_PASSWORD cuando RESET_ADMIN_PASSWD=1.
# =============================================================================
admin_passwd = ${ADMIN_PASSWORD:-${ODOO_ADMIN_PASSWORD:-admin}}

# =============================================================================
# Database Filter & Listing
# =============================================================================
dbfilter = ${DBFILTER:-.*}
# LIST_DB=True requerido para /web/database/manager.
# En producción, proteger por reverse-proxy; no exponer públicamente.
list_db = ${LIST_DB:-True}

# =============================================================================
# Logging Configuration
# logfile=None envía logs a stdout para que Docker los capture.
# =============================================================================
logfile = None
log_level = ${LOG_LEVEL:-info}
log_handler = ${LOG_HANDLER:-:INFO}

# =============================================================================
# Redis Configuration (Session Management)
# Requiere el addon session_redis en server_wide_modules si se usa Redis nativo.
# Si usas el módulo OCA session_redis, descomenta y ajusta las variables.
# =============================================================================
# session_redis = ${ODOO_SESSION_REDIS:-False}
# redis_host = ${ODOO_SESSION_REDIS_HOST:-redis}
# redis_port = ${ODOO_SESSION_REDIS_PORT:-6379}
# redis_db = 0
# redis_prefix = ${ODOO_SESSION_REDIS_PREFIX:-session}

# =============================================================================
# Performance Configuration
# =============================================================================
limit_request = ${LIMIT_REQUEST:-8196}
limit_memory_soft = ${LIMIT_MEMORY_SOFT:-2147483648}
limit_memory_hard = ${LIMIT_MEMORY_HARD:-2684354560}
limit_time_cpu = ${LIMIT_TIME_CPU:-600}
limit_time_real = ${LIMIT_TIME_REAL:-1200}
limit_time_real_cron = ${LIMIT_TIME_REAL_CRON:-0}
max_cron_threads = ${MAX_CRON_THREADS:-2}

# =============================================================================
# Demo Data (disabled for production)
# =============================================================================
without_demo = ${WITHOUT_DEMO:-all}

# =============================================================================
# Test Configuration (disabled for production)
# =============================================================================
test_enable = ${TEST_ENABLE:-False}
test_file = False

# =============================================================================
# SMTP Configuration (Optional)
# =============================================================================
smtp_server = ${SMTP_SERVER:-localhost}
smtp_port = ${SMTP_PORT:-25}
smtp_ssl = ${SMTP_SSL:-False}
smtp_user = ${SMTP_USER:-False}
smtp_password = ${SMTP_PASSWORD:-False}

# =============================================================================
# Unaccent Support
# =============================================================================
unaccent = ${UNACCENT:-False}
