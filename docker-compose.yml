services:
  db:                                                                         
    image: postgres:16
    restart: always
    environment:                                                              
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo                                                     
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: '--lc-collate=C'                                  
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo -d odoo']                       
      interval: 30s
      timeout: 10s                                                            
      retries: 5
      start_period: 30s                                                       
    volumes:
      - db-data:/var/lib/postgresql/data                                      
    networks:   
      - backend
    logging:
      driver: json-file
      options:                                                                
        max-size: 10m
        max-file: '3'                                                         
                
  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - '--appendonly'
      - 'yes'                                                                 
      - '--maxmemory'
      - '512mb'                                                               
      - '--maxmemory-policy'
      - allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s                                                           
      timeout: 5s
      retries: 5                                                              
    networks:   
      - backend
    volumes:
      - redis-data:/data                                                      
    logging:
      driver: json-file                                                       
      options:  
        max-size: 5m
        max-file: '3'

  odoo:
    image: ghcr.io/juanca2918/odoo18-ce:siteco-odoo-v1.0
    restart: always                                                           
    depends_on:
      db:                                                                     
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:                                                              
      DB_HOST: db
      DB_PORT: '5432'                                                         
      DB_USER: odoo
      DB_PASSWORD: odoo
      DBNAME: odoo
      DBFILTER: '^.*db$'
      ODOO_SESSION_REDIS: '1'                                                 
      ODOO_SESSION_REDIS_HOST: redis
      ODOO_SESSION_REDIS_PORT: '6379'                                         
      ODOO_SESSION_REDIS_PREFIX: odoo
      HTTP_INTERFACE: 0.0.0.0                                                 
      HTTP_PORT: '8069'
      PROXY_MODE: 'True'                                                      
      ADMIN_PASSWORD: admin
      WORKERS: '4'
      MAX_CRON_THREADS: '2'                                                   
      LIMIT_MEMORY_SOFT: '2147483648'
      LIMIT_MEMORY_HARD: '2684354560'                                         
      LIMIT_TIME_CPU: '60'                                                    
      LIMIT_TIME_REAL: '120'
      LOG_LEVEL: info                                                         
      LOG_HANDLER: ':INFO'
      WITHOUT_DEMO: all
      LIST_DB: 'False'
    expose:                                                                   
      - '8069'
      - '8072'                                                                
    volumes:    
      - odoo-data:/var/lib/odoo/data
      - odoo-logs:/var/lib/odoo/logs
      - odoo-modules:/mnt/extra-addons                                        
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:8069/web/health']        
      interval: 30s                                                           
      timeout: 10s
      retries: 5                                                              
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - backend
    logging:                                                                  
      driver: json-file
      options:                                                                
        max-size: 50m
        max-file: '5'

volumes:
  db-data:
  redis-data:
  odoo-data:
  odoo-logs:
  odoo-modules:                                                               
  
networks:                                                                     
  backend:
    driver: bridge