# =============================================================================
# Docker Compose Override — Development Only
# =============================================================================
# This file is automatically loaded by `docker compose up` when present.
# It adds build context and local volume mounts for development.
#
# For production, rename or delete this file so only docker-compose.yml applies.
# =============================================================================

services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Cliente PostgreSQL a instalar en la imagen. Debe coincidir con PG 16.
        PG_MAJOR: ${PG_MAJOR:-16}

    volumes:
      # Mount local addons for hot-reload during development
      - './addons:/mnt/extra-addons:delegated'
      # Mount config template — the entrypoint expands env vars into a
      # writable persistent copy at /var/lib/odoo/odoo.conf
      - './docker/odoo.conf:/etc/odoo/odoo.conf.template:ro'

    environment:
      # Single-threaded for debugging
      WORKERS: 0
      # Show DB manager in dev
      LIST_DB: 'True'
      # Enable demo data in dev
      WITHOUT_DEMO: 'False'
      LOG_LEVEL: debug
      # Set to '1' to regenerate odoo.conf from template after changes,
      # then set back to '0' and restart.
      FORCE_RECONFIG: ${FORCE_RECONFIG:-0}
