# =============================================================================
# Docker Compose Override — Development Only
# =============================================================================
# This file is automatically loaded by `docker compose up` when present.
# It adds build context and local volume mounts for development.
#
# For production, rename or delete this file so only docker-compose.yml applies.
# =============================================================================

services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11-slim}
        OS_VARIANT: ${OS_VARIANT:-bookworm}
        ODOO_VERSION: ${ODOO_VERSION:-18.0}
        WKHTMLTOX_VERSION: ${WKHTMLTOX_VERSION:-0.12.6.1-3}
        ODOO_USER: ${ODOO_USER:-odoo}
        ODOO_BASEPATH: ${ODOO_BASEPATH:-/opt/odoo}
        APP_UID: ${APP_UID:-101}
        APP_GID: ${APP_GID:-101}

    volumes:
      # Mount local addons for hot-reload during development
      - './addons:/mnt/extra-addons:delegated'
      # Mount config for easy editing
      - './docker/odoo.conf:/etc/odoo/odoo.conf:ro'

    environment:
      # Single-threaded for debugging
      WORKERS: 0
      # Show DB manager in dev
      LIST_DB: 'True'
      # Enable demo data in dev
      WITHOUT_DEMO: 'False'
      LOG_LEVEL: debug
