# =============================================================================
# Odoo 18 CE — Stack LOCAL de desarrollo (no usar en Coolify)
# =============================================================================
# Uso:
#   docker compose -f docker-compose.local.yml up -d
#       → Levanta PostgreSQL 16 + Redis 7 + Adminer.
#   docker compose -f docker-compose.local.yml --profile full up -d --build
#       → Además levanta Odoo 18 CE construido desde Dockerfile.
#
# Modelo mutable-friendly: la imagen base trae Odoo. Puedes colocar addons en
# ./custom_addons (o cualquier subdirectorio bajo ./) y montarlos en
# /mnt/extra-addons. También puedes poner un requirements.txt en la raíz del
# directorio montado para instalar librerías adicionales en runtime.
#
# Al usar -f explícito, docker-compose.override.yml NO se auto-carga.
# docker-compose.yml de la raíz es exclusivo para Coolify.
# =============================================================================

services:
  db:
    image: 'postgres:${PSQL_VERSION:-16}'
    restart: unless-stopped
    shm_size: '${DB_SHM_SIZE:-512mb}'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-odoo}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-password123}'
      POSTGRES_DB: '${POSTGRES_DB:-odoo}'
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: '--lc-collate=C'
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - 'db-data:/var/lib/postgresql/data'

  redis:
    image: 'redis:${REDIS_VERSION:-7-alpine}'
    restart: unless-stopped
    command:
      - redis-server
      - '--appendonly'
      - 'yes'
      - '--maxmemory'
      - '${REDIS_MAXMEMORY:-512mb}'
      - '--maxmemory-policy'
      - allkeys-lru
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - 'redis-data:/data'

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'

  odoo:
    # Solo arranca con: --profile full
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PG_MAJOR: '${PG_MAJOR:-16}'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8069:8069'
      - '127.0.0.1:8072:8072'
    environment:
      DB_HOST: db
      DB_USER: '${POSTGRES_USER:-odoo}'
      DB_PASSWORD: '${POSTGRES_PASSWORD:-password123}'
      DBNAME: '${POSTGRES_DB:-odoo}'
      DBFILTER: '${DBFILTER:-.*}'
      ODOO_SESSION_REDIS: '1'
      ODOO_SESSION_REDIS_HOST: redis
      ODOO_SESSION_REDIS_PORT: '6379'
      ODOO_SESSION_REDIS_PREFIX: '${ODOO_SESSION_REDIS_PREFIX:-session}'
      HTTP_INTERFACE: 0.0.0.0
      HTTP_PORT: '8069'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-password123}'
      ODOO_ADMIN_PASSWORD: '${ADMIN_PASSWORD:-password123}'
      # Dev: auto-inicializar la BD en el primer arranque.
      ODOO_AUTO_INIT: '1'
      ODOO_INIT_MODULES: '${ODOO_INIT_MODULES:-base}'
      # Dev: monoproceso, gestor de BD visible, datos demo y logs verbosos.
      WORKERS: 0
      LIST_DB: 'True'
      WITHOUT_DEMO: 'False'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      LOG_HANDLER: ':INFO'
      PROXY_MODE: 'False'
      FORCE_RECONFIG: '${FORCE_RECONFIG:-1}'
      RESET_ADMIN_PASSWD: '${RESET_ADMIN_PASSWD:-1}'
      LIMIT_TIME_CPU: '${LIMIT_TIME_CPU:-600}'
      LIMIT_TIME_REAL: '${LIMIT_TIME_REAL:-1200}'
      # Librerías pip extra separadas por espacio, ej: "pdf2image reportlab".
      ODOO_EXTRA_PIP: '${ODOO_EXTRA_PIP:-}'
    volumes:
      - 'odoo-data:/var/lib/odoo'
      # En dev puedes montar addons locales para hot-reload.
      # Crea el directorio ./custom_addons si vas a usarlo.
      - './custom_addons:/mnt/extra-addons:delegated'
      # Template de config: el entrypoint lo expande a /var/lib/odoo/odoo.conf
      - './docker/odoo.conf:/etc/odoo/odoo.conf.template:ro'
    healthcheck:
      test: [CMD, curl, '-sf', 'http://127.0.0.1:8069/web/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

volumes:
  db-data:
  redis-data:
  odoo-data:
  odoo-logs:
